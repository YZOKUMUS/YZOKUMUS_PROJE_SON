<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelime Kart Testi</title>
  <style>
    @font-face {
      font-family: "UthmaniHafs";
      src: url("ASSETS/fonts/KFGQPC Uthmanic Script HAFS Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-1: #1a1510;
      --bg-2: #2f2518;
      --paper-1: #f9f2dd;
      --paper-2: #edd9ad;
      --gold-1: #8f6a2a;
      --gold-2: #d4b46d;
      --ink-dark: #3b2e1f;
      --ink-soft: #6f5a3d;
      --text: #f8f3e7;
      --muted: #d9c9a8;
      --btn: #8f6a2a;
      --btn-hover: #725320;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 15%, rgba(212, 180, 109, 0.2) 0%, transparent 35%),
        radial-gradient(circle at 90% 20%, rgba(212, 180, 109, 0.13) 0%, transparent 30%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(940px, 100%);
      display: grid;
      gap: 20px;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 244, 214, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 180, 109, 0.42);
    }

    .status { color: var(--muted); font-size: 0.95rem; }
    .status strong { color: #f7d488; }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .filter-row label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .filter-select {
      border-radius: 10px;
      border: 1px solid rgba(212, 180, 109, 0.5);
      background: rgba(255, 244, 214, 0.12);
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.95rem;
      min-width: 90px;
    }

    .filter-select option {
      color: #1f1b14;
    }

    .card-wrap {
      perspective: 1300px;
      width: min(520px, 100%);
      justify-self: center;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 320px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }

    .card.flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 24px;
      text-align: center;
      backface-visibility: hidden;
      border: 2px solid var(--gold-1);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.35),
        inset 0 0 0 1px rgba(255, 246, 221, 0.65),
        inset 0 0 0 7px rgba(143, 106, 42, 0.22);
    }

    .front {
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.45), transparent 40%),
        linear-gradient(145deg, var(--paper-1), var(--paper-2));
      overflow: hidden;
      position: relative;
    }

    .front::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 2px solid rgba(143, 106, 42, 0.18);
      top: -90px;
      right: -80px;
    }

    .front::after {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 2px solid rgba(143, 106, 42, 0.16);
      bottom: -85px;
      left: -70px;
    }

    .back {
      background:
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.38), transparent 36%),
        linear-gradient(145deg, #f6e7c2, #e8d09c);
      transform: rotateY(180deg);
    }

    .front,
    .back {
      color: var(--ink-dark);
    }

    .front .label {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 0;
      width: calc(100% - 32px);
      text-align: center;
      z-index: 2;
    }

    .front .meta {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0;
      width: calc(100% - 32px);
      text-align: center;
      z-index: 2;
    }

    .back .label {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 0;
      width: calc(100% - 32px);
      text-align: center;
      z-index: 2;
    }

    .back .meta {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0;
      width: calc(100% - 32px);
      text-align: center;
      z-index: 2;
    }

    .label {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 10px;
      z-index: 1;
      font-weight: 700;
    }

    .arabic {
      font-size: clamp(3.2rem, 12vw, 8.2rem);
      line-height: 1.15;
      direction: rtl;
      z-index: 1;
      font-family: "UthmaniHafs", "Traditional Arabic", "Amiri", serif;
      font-weight: 400;
      text-shadow: 0 2px 4px rgba(143, 106, 42, 0.25);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      margin: 0;
    }

    .turkish {
      font-size: clamp(1.1rem, 3.2vw, 1.8rem);
      line-height: 1.4;
      max-width: 90%;
      margin: 0;
    }

    .meta {
      margin-top: 12px;
      font-size: 0.95rem;
      color: var(--ink-soft);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #f7edd8;
      background: var(--btn);
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover { background: var(--btn-hover); color: #fff9eb; }

    .ghost {
      color: var(--text);
      background: rgba(212, 180, 109, 0.16);
      border: 1px solid rgba(212, 180, 109, 0.44);
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="status" id="status">Veri yükleniyor...</div>
      <div class="status">Kartı çevir: <strong>Tıkla</strong> veya <strong>Boşluk</strong></div>
    </div>

    <div class="filter-row">
      <label for="letterFilter">Harf Filtresi:</label>
      <select id="letterFilter" class="filter-select" aria-label="Harf filtresi">
        <option value="ALL">Tumu</option>
      </select>
    </div>

    <div class="card-wrap" id="cardWrap" aria-label="Kelime kartı">
      <div class="card" id="card">
        <div class="face front">
          <div class="label">Arapça Kelime</div>
          <div class="arabic" id="arabicWord">...</div>
          <div class="meta" id="wordId">ID: -</div>
        </div>
        <div class="face back">
          <div class="label">Türkçe Anlam</div>
          <div class="turkish" id="turkishMeaning">...</div>
          <div class="meta" id="surahName">Sure: -</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ghost" id="flipBtn">Kartı Çevir</button>
      <button id="nextBtn">Sonraki</button>
      <button class="ghost" id="randomBtn">Rastgele</button>
    </div>

    <div class="hint">Bu test sayfası `data/kelimebul.json` verisiyle çalışır.</div>
  </div>

  <script>
    let allWords = [];
    let words = [];
    let currentIndex = 0;

    const statusEl = document.getElementById("status");
    const cardEl = document.getElementById("card");
    const arabicEl = document.getElementById("arabicWord");
    const meaningEl = document.getElementById("turkishMeaning");
    const wordIdEl = document.getElementById("wordId");
    const surahEl = document.getElementById("surahName");
    const letterFilterEl = document.getElementById("letterFilter");

    function flipCard() {
      cardEl.classList.toggle("flipped");
    }

    function renderWord(index) {
      if (!words.length) return;
      const item = words[index];
      arabicEl.textContent = item.kelime || "-";
      meaningEl.textContent = item.anlam || "-";
      wordIdEl.textContent = "ID: " + (item.id || "-");
      surahEl.textContent = "Sure: " + (item.sure_adi || "-");
      statusEl.textContent = "Kart " + (index + 1) + " / " + words.length;
      cardEl.classList.remove("flipped");
    }

    function nextWord() {
      if (!words.length) return;
      currentIndex = (currentIndex + 1) % words.length;
      renderWord(currentIndex);
    }

    function randomWord() {
      if (!words.length) return;
      const next = Math.floor(Math.random() * words.length);
      currentIndex = next;
      renderWord(currentIndex);
    }

    function normalizeForTurkishSort(text) {
      return String(text || "")
        .trim()
        .replace(/^[^A-Za-zÇĞIİÖŞÜçğıöşü]+/u, "")
        .toLocaleLowerCase("tr");
    }

    function getLeadingLetter(text) {
      const cleaned = String(text || "")
        .trim()
        .replace(/^[^A-Za-zÇĞIİÖŞÜçğıöşü]+/u, "")
        .toLocaleUpperCase("tr");
      return cleaned ? cleaned[0] : "";
    }

    function countWordChars(text) {
      return Array.from(String(text || "").trim()).length;
    }

    function buildLetterFilterOptions(sourceWords) {
      const letters = Array.from(
        new Set(sourceWords.map(item => getLeadingLetter(item.anlam)).filter(Boolean))
      ).sort((a, b) => a.localeCompare(b, "tr"));

      letterFilterEl.innerHTML = '<option value="ALL">Tumu</option>';
      for (const letter of letters) {
        const option = document.createElement("option");
        option.value = letter;
        option.textContent = letter;
        letterFilterEl.appendChild(option);
      }
    }

    function applyLetterFilter(selectedLetter) {
      if (selectedLetter === "ALL") {
        words = [...allWords];
      } else {
        words = allWords.filter(item => getLeadingLetter(item.anlam) === selectedLetter);
      }

      if (!words.length) {
        statusEl.textContent = "Bu harf icin uygun kayit yok.";
        arabicEl.textContent = "-";
        meaningEl.textContent = "-";
        wordIdEl.textContent = "ID: -";
        surahEl.textContent = "Sure: -";
        return;
      }

      currentIndex = 0;
      renderWord(currentIndex);
    }

    async function loadData() {
      try {
        const res = await fetch("./data/kelimebul.json");
        if (!res.ok) {
          throw new Error("JSON yüklenemedi: HTTP " + res.status);
        }
        const data = await res.json();
        allWords = data
          .filter(
            item =>
              item &&
              item.kelime &&
              item.anlam &&
              countWordChars(item.kelime) === 6
          )
          .sort((a, b) =>
            normalizeForTurkishSort(a.anlam).localeCompare(
              normalizeForTurkishSort(b.anlam),
              "tr"
            )
          );
        if (!allWords.length) {
          statusEl.textContent = "Uygun kayıt bulunamadı.";
          return;
        }

        buildLetterFilterOptions(allWords);
        applyLetterFilter("ALL");
      } catch (err) {
        statusEl.textContent = "Hata: " + err.message;
      }
    }

    document.getElementById("cardWrap").addEventListener("click", flipCard);
    document.getElementById("flipBtn").addEventListener("click", flipCard);
    document.getElementById("nextBtn").addEventListener("click", nextWord);
    document.getElementById("randomBtn").addEventListener("click", randomWord);
    letterFilterEl.addEventListener("change", (e) => {
      applyLetterFilter(e.target.value);
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.key === "ArrowRight") {
        nextWord();
      }
    });

    loadData();
  </script>
</body>
</html>
